services:
  # CTFd stays on the shared entry point; web evidence services use their own host ports.
  gateway:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ctfd
    networks:
      - ctf_public

  # ---------- control plane ----------
  ctfd:
    image: ctfd/ctfd:3.7.0
    restart: unless-stopped
    environment:
      - DATABASE_URL=mysql+pymysql://ctfd:ctfd@db/ctfd
      - REDIS_URL=redis://cache:6379
      - REVERSE_PROXY=1,1,1,1,0
    depends_on:
      - db
      - cache
    networks:
      - ctf_public
      - ctf_internal

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=ctfd_root_pw
      - MYSQL_DATABASE=ctfd
      - MYSQL_USER=ctfd
      - MYSQL_PASSWORD=ctfd
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - ctf_internal

  cache:
    image: redis:7
    restart: unless-stopped
    networks:
      - ctf_internal

  # ---------- challenge stages ----------
  stage1:
    build: ./challenges/stage1-steg
    restart: unless-stopped
    read_only: true
    tmpfs: ["/var/cache/nginx", "/var/run", "/tmp"]
    ports: ["8001:80"]
    volumes:
      - ./challenges/paper-zero.css:/usr/share/nginx/html/paper-zero.css:ro
    networks: [ctf_public]

  stage2:
    build: ./challenges/stage2-web
    restart: unless-stopped
    ports: ["8002:80"]
    volumes:
      - ./challenges/paper-zero.css:/var/www/html/paper-zero.css:ro
    networks: [ctf_public]

  stage3:
    build: ./challenges/stage3-forensics
    restart: unless-stopped
    read_only: true
    tmpfs: ["/var/cache/nginx", "/var/run", "/tmp"]
    ports: ["8003:80"]
    volumes:
      - ./challenges/paper-zero.css:/usr/share/nginx/html/paper-zero.css:ro
    networks: [ctf_public]

  stage4:
    build: ./challenges/stage4-linux
    restart: unless-stopped
    ports: ["8004:22"]
    networks: [ctf_public]

  stage5:
    build: ./challenges/stage5-injection
    restart: unless-stopped
    ports: ["8005:5000"]
    volumes:
      - ./challenges/paper-zero.css:/app/paper-zero.css:ro
    networks: [ctf_public]

  stage6:
    build: ./challenges/stage6-reversing
    restart: unless-stopped
    ports: ["8006:80"]
    volumes:
      - ./challenges/paper-zero.css:/usr/share/nginx/html/paper-zero.css:ro
    networks: [ctf_public]

networks:
  ctf_public:
  ctf_internal:

volumes:
  db_data:

